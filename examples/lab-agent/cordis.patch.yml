# 实验自动化开发 overlay：叠加在既有 headless profile 上，不修改默认 profile。
# Agent 只消费带引用的 Knowledge 结果；资料录入和 SOP 管理由独立 Knowledge 工作台负责。
- insert:
    - id: lab-mvp
      name: '@deepseek-ai/dsh-experimental-lab-mvp'
      config:
        knowledgePath: .lab-data/knowledge.sqlite
        docling: {}
        device:
          devices:
            - id: dev-dispenser
              name: development dispenser
              capabilities:
                - dispense

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: tool-lab
      name: '@deepseek-ai/dsh-experimental-tool-lab'

    - id: tool-lab-project
      name: '@deepseek-ai/dsh-experimental-tool-lab-project'
